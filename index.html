function refillCities(){let co=$('county').value,cur=$('city').value; $('city').innerHTML='<option value="">All cities</option>';[...new Set(R.filter(r=>!co||r.county===co).map(r=>r.city).filter(Boolean))].sort().forEach(v=>$('city').add(new Option(v,v))); if([...$('city').options].some(o=>o.value===cur))$('city').value=cur}
[...new Set(R.map(r=>r.type).filter(Boolean))].sort().forEach(v=>$('type').add(new Option(v,v)));
function rows(){let q=$('q').value.toLowerCase(),co=$('county').value,c=$('city').value,t=$('type').value,mm=$('mapped').value;return R.filter(r=>(!q||JSON.stringify(r).toLowerCase().includes(q))&&(!co||r.county===co)&&(!c||r.city===c)&&(!t||r.type===t)&&(!mm||(mm==='yes')===(r.lat!=null)))}
function popup(r){return `<b>${esc(r.name)}</b><br>${esc(r.address)}<br>${esc(r.city)}, ${esc(r.state)} ${esc(r.zip)}<br><small>${esc(r.county)} County · ${esc(r.type)} · License ${esc(r.license)}</small><br><a target="_blank" href="${gm(r)}">Google Maps</a> · <a target="_blank" href="${am(r)}">Apple Maps</a>`}
function render(){layer.clearLayers();markerById.clear();$('list').innerHTML='';let a=rows(),mc=0;a.forEach(r=>{if(r.lat!=null){let m=L.marker([r.lat,r.lon]).bindPopup(popup(r)).addTo(layer);markerById.set(r.id,m);mc++}let d=document.createElement('div');d.className='card '+(r.lat==null?'warn':'');d.innerHTML=`<b>${esc(r.name)}</b><br>${esc(r.address)}<br>${esc(r.city)}, ${esc(r.state)} ${esc(r.zip)}<br><span class="pill">${esc(r.county)} · ${esc(r.type)}</span> ${r.lat==null?'⚠️ unmatched':'📍'}<div class="links"><a target="_blank" href="${gm(r)}">Google Maps</a><a target="_blank" href="${am(r)}">Apple Maps</a></div>`;d.onclick=e=>{if(e.target.tagName!=='A'&&markerById.has(r.id)){let m=markerById.get(r.id);map.setView(m.getLatLng(),15);m.openPopup()}};$('list').appendChild(d)});$('stats').textContent=`${a.length} locations · ${mc} mapped pins · ${a.length-mc} unmatched`}
$('q').addEventListener('input',render);['city','type','mapped'].forEach(id=>$(id).addEventListener('change',render));$('county').addEventListener('change',()=>{refillCities();render()});$('fit').onclick=()=>{let ls=layer.getLayers();if(ls.length)map.fitBounds(L.featureGroup(ls).getBounds().pad(.05))};refillCities();render();
</script></body></html>
